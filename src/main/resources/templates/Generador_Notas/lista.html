<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>

        <aside th:replace="~{general/fragmentos :: header}"></aside>

        <main class="container-fluid p-4 p-lg-5">

            <div th:replace="~{general/fragmentos :: usuarioActual}"></div>

            <nav class="mb-4" aria-label="Volver al generador">
                <a th:href="@{/Generador_Notas/generador}"
                   class="btn btn-outline-primary">
                    ← Volver al generador
                </a>
            </nav>

            <section class="sn-panel">

                <h1 class="h3 fw-bold mb-4">
                    Notas guardadas
                </h1>

                <div th:if="${error}"
                     class="alert alert-danger alert-dismissible fade show"
                     role="alert">

                    <span th:text="${error}"></span>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="alert"
                            aria-label="Cerrar">
                    </button>
                </div>

                <div class="table-responsive">
                    <table class="table align-middle">

                        <thead class="table-light">
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Plantilla</th>
                                <th scope="col">Responsable</th>
                                <th scope="col">Estado</th>
                                <th scope="col">Fecha del error</th>
                                <th scope="col">Fecha de emisión</th>
                                <th scope="col">Acciones</th>
                            </tr>
                        </thead>

                        <tbody>

                            <tr th:if="${#lists.isEmpty(notas)}">
                                <td colspan="7"
                                    class="text-center text-secondary py-4">
                                    No hay notas guardadas.
                                </td>
                            </tr>

                            <tr th:each="nota : ${notas}">

                                <td th:text="${nota.idNota}"></td>

                                <td th:text="${nota.plantilla != null
                                    ? nota.plantilla.nombre
                                    : 'Sin plantilla'}">
                                </td>

                                <td th:text="${nota.teamMember != null
                                    ? nota.teamMember.nombre
                                    : 'Sin miembro asignado'}">
                                </td>

                                <td>
                                    <span class="badge bg-secondary"
                                          th:text="#{'nota.estado.' + ${nota.estado.name()}}">
                                    </span>

                                </td>

                                <td th:text="${nota.fechaError != null
                                    ? #temporals.format(
                                    nota.fechaError, 'dd/MM/yyyy')
                                    : 'Sin fecha'}">
                                </td>

                                <td th:text="${nota.fechaEmision != null
                                    ? #temporals.format(
                                    nota.fechaEmision, 'dd/MM/yyyy')
                                    : 'Sin fecha'}">
                                </td>

                                <td>
                                    <div class="d-flex flex-wrap gap-2">

                                        <a th:href="@{/Generador_Notas/notas/{id}(id=${nota.idNota})}"
                                           class="btn btn-sm btn-outline-primary">
                                            Ver
                                        </a>

                                        <a th:if="${nota.estado.name() == 'BORRADOR' or nota.estado.name() == 'RECHAZADA'}"
                                           th:href="@{/Generador_Notas/notas/{id}/editar(id=${nota.idNota})}"
                                           class="btn btn-sm btn-outline-secondary">
                                            Editar
                                        </a>

                                        <form th:if="${nota.estado.name() == 'BORRADOR'}"
                                              th:action="@{/Generador_Notas/notas/{id}/eliminar(id=${nota.idNota})}"
                                              method="post"
                                              class="m-0"
                                              onsubmit="return confirm('¿Deseas eliminar esta nota?');">

                                            <button type="submit"
                                                    class="btn btn-sm btn-outline-danger">
                                                Eliminar
                                            </button>

                                        </form>

                                    </div>
                                </td>

                            </tr>

                        </tbody>
                    </table>
                </div>

            </section>

        </main>

    </body>
</html>
